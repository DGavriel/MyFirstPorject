<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>בדיקת תיק ביטוחי ללא עלות</title>
<meta name="description" content="בדיקה מקיפה של התיק הביטוחי שלכם, ללא עלות. איתור כפילויות וכיסויים מיותרים וחיסכון של אלפי שקלים בשנה.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>

<main class="wrap">
  <div class="card">

    <div class="progress" id="progress">
      <div class="progress__track"><div class="progress__fill" id="progressFill"></div></div>
      <span class="progress__label" id="progressLabel">0%</span>
    </div>

    <div class="slides" id="slides" aria-live="polite"></div>

  </div>

  <p class="legal">
    הבדיקה אינה מהווה ייעוץ ביטוחי ואינה מחייבת אתכם בדבר. הפרטים משמשים ליצירת קשר ולבדיקת התיק בלבד.
  </p>
</main>

<script src="insurance.js"></script>
<script src="form.js"></script>
</body>
</html>
